apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: angular-app-dr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sonujha78/dc-dr-deployment.git
    targetRevision: main
    path: helm-charts/angular-app
    helm:
      valueFiles:
        - values-dr.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ci-cd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
